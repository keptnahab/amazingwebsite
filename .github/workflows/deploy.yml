name: Deploy to Strato

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - locale: en
            remote_path_secret: SFTP_REMOTE_PATH
          - locale: de
            remote_path_secret: SFTP_REMOTE_PATH_DE
    # the de leg deploys nowhere useful until SFTP_REMOTE_PATH_DE is set up
    # (see plan: tolleslicht.de hosting not wired yet) — don't fail the run
    continue-on-error: ${{ matrix.locale == 'de' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build (${{ matrix.locale }})
        run: npm run build
        env:
          PUBLIC_LOCALE: ${{ matrix.locale }}

      - name: Deploy via SFTP (${{ matrix.locale }})
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local_path: "./dist/*"
          remote_path: ${{ secrets[matrix.remote_path_secret] }}
          sftp_only: true
